<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4f0">
  <title>Forgot password | Northstar</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20231f;
      background: #f5f4f0;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(ellipse at 9% 12%, rgba(218, 227, 205, 0.48), transparent 35%),
        radial-gradient(ellipse at 92% 91%, rgba(234, 224, 206, 0.46), transparent 32%),
        #f5f4f0;
    }

    .card {
      width: min(100%, 520px);
      padding: clamp(30px, 7vw, 58px);
      border: 1px solid rgba(32, 35, 31, 0.07);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(37, 39, 31, 0.1);
    }

    .brand {
      color: #40583b;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    h1 {
      margin: 42px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: -0.035em;
    }

    .intro {
      margin: 10px 0 30px;
      color: #777a73;
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #343831;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 49px;
      padding: 0 14px;
      border: 1px solid #e2e3dd;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #20231f;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #708566;
      box-shadow: 0 0 0 3px rgba(112, 133, 102, 0.14);
    }

    button {
      width: 100%;
      min-height: 49px;
      margin-top: 20px;
      border: 0;
      border-radius: 9px;
      background: #40583b;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
    }

    button:hover:not(:disabled) {
      background: #344a30;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(112, 133, 102, 0.42);
      outline-offset: 3px;
    }

    .message {
      min-height: 21px;
      margin: 15px 0 0;
      color: #a34a3d;
      font-size: 13px;
      line-height: 1.5;
    }

    .message[data-state="success"] {
      color: #526647;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #4a6043;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .back-link:hover {
      color: #344b32;
    }

    @media (max-width: 420px) {
      body {
        padding: 16px;
      }
    }
  </style>
  <script src="/javascript/forgot-password.js" defer></script>
</head>
<body>
  <main class="card">
    <a class="brand" href="index.html">northstar</a>
    <h1>Reset your password</h1>
    <p class="intro">Enter your email address to record a password reset request. Password reset emails are not enabled in this demo.</p>

    <form id="forgot-password-form" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required maxlength="254">
      <button type="submit">Request password reset</button>
      <p class="message" id="form-message" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="index.html">Back to sign in</a>
  </main>
</body>
</html>
